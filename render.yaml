databases:
  - name: core-delight-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: core-delight
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: core-delight-db
          property: connectionString
