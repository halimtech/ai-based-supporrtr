services:
  - type: web
    name: core-delight
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Neon Postgres connection string. The actual value is set in the
      # Render dashboard (Environment tab) so the secret stays out of git.
      - key: DATABASE_URL
        sync: false
